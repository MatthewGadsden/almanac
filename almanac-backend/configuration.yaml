application_port: 8080
# Signs and encrypts the admin session cookie. Must be at least 64 characters.
# This is a development key; override it in other environments with APP_SESSION_KEY.
session_key: "a4af0767359d9904f05c22f6099d8f40eb9f832782ff0efa553768b8c72c3a0aaaee6453789d0910"
# Set to true when served over HTTPS so the session cookie is marked Secure.
secure_cookies: false
database:
  host: "127.0.0.1"
  port: 5434
  username: "postgres"
  password: "postgres"
  database_name: "almanac"
connectors:
  # Where Letterboxd RSS feeds are fetched from (tests point this at a mock server)
  letterboxd_base_url: "https://letterboxd.com"
  # How often every connection is re-synced while the API runs; 0 turns automatic syncing off
  sync_interval_minutes: 360
  strava:
    # From your API application at https://www.strava.com/settings/api.
    # Leave client_id empty to turn Strava off.
    client_id: ""
    # Don't commit this: put it in configuration.local.yaml (git-ignored) or set
    # APP_CONNECTORS__STRAVA__CLIENT_SECRET instead
    client_secret: ""
    # Where Strava sends you back after you authorise; must be on the application's
    # Authorization Callback Domain (localhost is allowed for development)
    redirect_uri: "http://localhost:5173/admin/strava/callback"
    oauth_base_url: "https://www.strava.com/oauth"
    api_base_url: "https://www.strava.com/api/v3"
